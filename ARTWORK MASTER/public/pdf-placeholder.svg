<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f8f9fa"/>
  
  <!-- PDF Icon -->
  <rect x="50" y="40" width="100" height="120" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2" rx="4"/>
  
  <!-- PDF Text -->
  <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">PDF</text>
  
  <!-- Document Lines -->
  <rect x="60" y="90" width="80" height="2" fill="#9ca3af"/>
  <rect x="60" y="100" width="60" height="2" fill="#9ca3af"/>
  <rect x="60" y="110" width="70" height="2" fill="#9ca3af"/>
  <rect x="60" y="120" width="50" height="2" fill="#9ca3af"/>
  
  <!-- File Name -->
  <text x="100" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Document</text>
</svg> 