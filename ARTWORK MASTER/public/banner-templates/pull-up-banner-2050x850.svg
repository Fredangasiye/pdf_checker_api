<svg width="2050" height="850" viewBox="0 0 2050 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="2050" height="850" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="1025" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a">
    PULL-UP BANNER
  </text>
  <text x="1025" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">
    2050×850mm
  </text>
  
  <!-- Bleed Area (Outermost) - 2090×890 -->
  <rect x="20" y="20" width="2010" height="810" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="30" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ec4899">BLEED-2090×890</text>
  
  <!-- Trim Area (Middle) - 2050×850 -->
  <rect x="40" y="40" width="1970" height="770" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">TRIM-2050×850</text>
  
  <!-- Live Area (Innermost) - 1955×830 -->
  <rect x="60" y="60" width="1930" height="730" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="70" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3b82f6">LIVE AREA-1955×830</text>
  
  <!-- Center Guide -->
  <circle cx="1025" cy="425" r="50" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="1025" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Drop Artwork Here</text>
</svg> 